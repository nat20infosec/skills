name: Validate plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-plugins.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify aws-cspm CLI commands exist in botocore
        run: |
          pip install --quiet botocore
          python scripts/verify-aws-commands.py
